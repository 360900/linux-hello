<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the name, anyone may call it: the service checks
     callers itself (caller uid and polkit) -->
<busconfig>
  <policy user="root">
    <allow own="io.github.LinuxHello1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.LinuxHello1"
           send_interface="io.github.LinuxHello1.Manager"/>
    <allow send_destination="io.github.LinuxHello1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.LinuxHello1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
