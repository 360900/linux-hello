# systemd drop-in for polkit-agent-helper@.service
#
# Newer polkit versions sandbox the agent helper with PrivateDevices=yes,
# which blocks camera access during authentication and leaves face
# authentication prompts hanging (see boltgolt/howdy#1077, #1104).
#
# This drop-in is installed to the package directory
# /usr/lib/systemd/system/polkit-agent-helper@.service.d/ so distribution
# drop-ins in /usr still take precedence over ours only if numbered higher;
# "10-" keeps it early while remaining overridable by admins in /etc.

[Unit]
# Only needed when pam_linux_hello.so is in the polkit PAM stack;
# harmless otherwise, the helper simply keeps full device access.
# To scope this per-system, use the "Linux Hello" GUI settings page.

[Service]
# Allow the helper's children (pam_linux_hello.so -> linux-hello-cli ->
# compare.py) to open the IR camera
PrivateDevices=no
DeviceAllow=char-video4linux rw
